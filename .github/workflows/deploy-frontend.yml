name: Deploy frontend to AWS

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-auction-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::005696749668:role/LiveAuctionFrontendDeployRole
          role-session-name: LiveAuctionFrontendDeploy
          aws-region: ap-southeast-1
          allowed-account-ids: "005696749668"
          mask-aws-account-id: true

      - name: Upload build to S3
        run: aws s3 sync dist s3://live-auction-frontend-callmesen-2026 --delete

      - name: Refresh CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E5G1D5KGO3JL3 --paths "/*"